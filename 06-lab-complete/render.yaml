# Render Blueprint — agent (Docker) + Redis (Key Value)
# Render đọc file này khi tạo Blueprint từ repo. rootDir trỏ vào thư mục Part 6.
services:
  - type: web
    name: production-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true        # Render tự sinh secret, không ghi giá trị ở đây
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []                # chỉ cho các service nội bộ của Render kết nối
