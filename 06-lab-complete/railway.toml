# Railway — build bằng Dockerfile, Railway cấp PORT (CMD trong Dockerfile đã dùng ${PORT:-8000})
# Secret đặt trên dashboard / CLI, không ghi ở đây:
#   railway variables --set AGENT_API_KEY=<key> --set REDIS_URL='${{Redis.REDIS_URL}}'

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
